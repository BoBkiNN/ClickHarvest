name: ClickHarvest
version: '${project.version}'
main: xyz.bobkinn_.clickharvest.ClickHarvest
api-version: 1.13
load: STARTUP
author: "BoBkiNN_"
description: "Collect crops using right click"
softdepend:
  - WorldGuard

commands:
  clickharvest:
    description: "Enable/disable auto collect"
    permission: "clickharvest.switch"

  clickharvestreload:
    description: "Reload plugin configuration"
    permission: "clickharvest.reload"

permissions:
  "clickharvest.switch":
    default: "true"
  "clickharvest.reload":
    default: op